// ===== 常量 =====
const FONT = 11;
const LINE_H = 15;
const PAD_X = 9;
const PAD_Y = 6;
const TAG_W = 14;      // 折叠标记预留宽度
const LEVEL_X = 205;
const GAP = 9;         // 叶子纵向间距
const MARGIN_X = 20;
const MARGIN_Y = 18;

// ===== 状态 =====
const collapsed = new Set();
let nodes = [];

function isLeaf(n) { return !n.children || n.children.length === 0; }

function textWidth(str) {
  let w = 0;
  for (const ch of str) w += (ch.charCodeAt(0) > 255) ? FONT : FONT * 0.62;
  return w;
}

function measure(n) {
  const lines = (n.name || "").split("\n");
  let maxW = 0;
  for (const l of lines) maxW = Math.max(maxW, textWidth(l));
  const kids = !isLeaf(n);
  const w = Math.max(40, maxW + PAD_X * 2 + (kids ? TAG_W : 0));
  const h = lines.length * LINE_H + PAD_Y * 2;
  return { lines, w, h };
}

// 建立 parent 引用
(function link(node) {
  if (node.children) for (const c of node.children) { c._parent = node; link(c); }
})(root);
// 一级分支 top 引用（携带颜色）
root.children.forEach(function (top) {
  (function setTop(n) { n.top = top; if (n.children) n.children.forEach(setTop); })(top);
});

function initDefaultCollapse() {
  collapsed.clear();
  (function walk(n) {
    if (!isLeaf(n) && n.children.every(isLeaf)) collapsed.add(n);
    if (n.children) n.children.forEach(walk);
  })(root);
}

let yCursor = 0;
function layout(n, depth) {
  const m = measure(n);
  const kids = (!isLeaf(n) && !collapsed.has(n)) ? n.children : null;
  let cy;
  if (!kids) {
    const top = MARGIN_Y + yCursor;
    cy = top + m.h / 2;
    yCursor += m.h + GAP;
  } else {
    const cys = kids.map(c => layout(c, depth + 1));
    cy = (cys[0] + cys[cys.length - 1]) / 2;
  }
  nodes.push({ n, x: MARGIN_X + depth * LEVEL_X, cy, w: m.w, h: m.h, depth, lines: m.lines });
  return cy;
}

function render() {
  nodes = []; yCursor = 0;
  layout(root, 0);
  let maxX = 0;
  for (const o of nodes) maxX = Math.max(maxX, o.x + o.w);
  const totalW = maxX + MARGIN_X;
  const totalH = yCursor + MARGIN_Y;

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 " + totalW + " " + totalH);
  svg.setAttribute("width", "100%");
  svg.style.maxWidth = totalW + "px";

  // 连接线（先画，在节点下方）
  const gEdge = document.createElementNS(svgNS, "g");
  for (const o of nodes) {
    if (o.n === root) continue;
    const p = nodes.find(q => q.n === o.n._parent);
    if (!p) continue;
    const x1 = p.x + p.w, y1 = p.cy;
    const x2 = o.x, y2 = o.cy;
    const mx = (x1 + x2) / 2;
    const d = "M " + x1 + " " + y1 + " C " + mx + " " + y1 + ", " + mx + " " + y2 + ", " + x2 + " " + y2;
    const path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#3a4a63");
    path.setAttribute("stroke-width", "1.4");
    gEdge.appendChild(path);
  }
  svg.appendChild(gEdge);

  // 节点
  for (const o of nodes) {
    const g = document.createElementNS(svgNS, "g");
    g.setAttribute("class", "node");
    g.setAttribute("transform", "translate(" + o.x + ", " + (o.cy - o.h / 2) + ")");

    const rect = document.createElementNS(svgNS, "rect");
    rect.setAttribute("width", o.w);
    rect.setAttribute("height", o.h);
    rect.setAttribute("rx", "6");

    let fill, stroke, textColor, dash = null;
    if (o.n === root) {
      fill = "#7c3aed"; stroke = "#a78bfa"; textColor = "#ffffff";
    } else if (o.n.tag === "预留") {
      fill = "rgba(30,41,59,0.9)"; stroke = "#fbbf24"; textColor = "#fcd34d"; dash = "4 3";
    } else {
      const base = o.n.top ? o.n.top.color : "#64748b";
      if (isLeaf(o.n)) {
        fill = "rgba(30,41,59,0.9)"; stroke = "#475569"; textColor = "#cbd5e1";
      } else {
        fill = base; stroke = base; textColor = "#ffffff";
      }
    }
    rect.setAttribute("fill", fill);
    rect.setAttribute("stroke", stroke);
    rect.setAttribute("stroke-width", o.n === root ? "1.5" : "1.2");
    if (dash) rect.setAttribute("stroke-dasharray", dash);

    const hasKids = !isLeaf(o.n);
    const cx = (o.w - (hasKids ? TAG_W : 0)) / 2;

    const txt = document.createElementNS(svgNS, "text");
    txt.setAttribute("x", cx);
    txt.setAttribute("text-anchor", "middle");
    txt.setAttribute("font-size", FONT);
    if (o.n === root) txt.setAttribute("font-weight", "600");
    txt.setAttribute("fill", textColor);
    const totalTextH = o.lines.length * LINE_H;
    const firstBaseline = (o.h - totalTextH) / 2 + LINE_H * 0.72;
    o.lines.forEach(function (l, i) {
      const ts = document.createElementNS(svgNS, "tspan");
      ts.setAttribute("x", cx);
      ts.setAttribute("dy", i === 0 ? firstBaseline : LINE_H);
      ts.textContent = l;
      txt.appendChild(ts);
    });

    g.appendChild(rect);
    g.appendChild(txt);

    if (hasKids) {
      const tag = document.createElementNS(svgNS, "text");
      tag.setAttribute("class", "collapse-tag");
      tag.setAttribute("x", o.w - 5);
      tag.setAttribute("y", 11);
      tag.setAttribute("text-anchor", "end");
      tag.setAttribute("font-size", "10");
      tag.setAttribute("fill", "rgba(255,255,255,0.9)");
      tag.textContent = collapsed.has(o.n) ? "▸" : "▾";
      g.appendChild(tag);
    }

    g.addEventListener("click", function (e) {
      e.stopPropagation();
      if (isLeaf(o.n)) return;
      if (collapsed.has(o.n)) collapsed.delete(o.n); else collapsed.add(o.n);
      render();
    });

    svg.appendChild(g);
  }

  const wrap = document.getElementById("map");
  wrap.innerHTML = "";
  wrap.appendChild(svg);
}

document.getElementById("btnExpand").addEventListener("click", function () { collapsed.clear(); render(); });
document.getElementById("btnModule").addEventListener("click", function () { initDefaultCollapse(); render(); });

initDefaultCollapse();
render();
</script>
