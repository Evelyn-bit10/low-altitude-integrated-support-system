<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1930"/>
      <stop offset="1" stop-color="#050910"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9bff"/>
      <stop offset="1" stop-color="#27e0d8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#27e0d8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#27e0d8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#halo)"/>

  <!-- 雷达圈 -->
  <g fill="none" stroke="url(#neon)" stroke-opacity="0.5">
    <circle cx="256" cy="256" r="74" stroke-width="2"/>
    <circle cx="256" cy="256" r="118" stroke-width="1.6" stroke-dasharray="12 10"/>
    <circle cx="256" cy="256" r="164" stroke-width="1.4" stroke-opacity="0.28"/>
  </g>

  <!-- 扫描扇形 -->
  <path d="M256 256 L256 92 A164 164 0 0 1 400 340 Z" fill="url(#neon)" opacity="0.14"/>

  <!-- 飞行器 -->
  <g transform="translate(256 250) rotate(38)">
    <path d="M0 -58 L20 34 L0 20 L-20 34 Z" fill="url(#neon)"/>
    <path d="M0 -58 L20 34 L0 20 L-20 34 Z" fill="none" stroke="#d9fdff" stroke-width="3" stroke-opacity="0.55"/>
  </g>

  <!-- 起降点 H -->
  <g stroke="#d9fdff" stroke-width="9" stroke-linecap="round" opacity="0.92">
    <path d="M226 402 v46"/>
    <path d="M286 402 v46"/>
    <path d="M226 425 h60"/>
  </g>
</svg>
