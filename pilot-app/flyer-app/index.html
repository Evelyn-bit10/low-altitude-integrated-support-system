<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>挺中航空 · C 端</title>

  <meta name="theme-color" content="#05070f" />
  <meta name="description" content="挺中航空科技有限公司 · 飞手端 App：起降点周边信息与飞行器实时动态" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />

  <!-- iOS 添加到主屏后以全屏 App 形式运行 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="挺中航空" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body data-tab="home">

  <div class="backdrop" aria-hidden="true">
    <div class="backdrop-grid"></div>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
  </div>

  <!-- ===================== 顶部 HUD 状态条 ===================== -->
  <header class="hud">
    <div class="hud-brand">
      <span class="brand-mark"><i></i><i></i><i></i></span>
      <span class="brand-text"><b>挺中航空</b><small>PILOT CLIENT</small></span>
    </div>
    <div class="hud-meta">
      <span id="sync-badge" class="sync-badge mock">演示</span>
      <time id="hud-clock" class="mono">--:--:--</time>
    </div>
  </header>

  <!-- ===================== 内容区 ===================== -->
  <main id="screen" class="screen"></main>

  <!-- ===================== 底部 TabBar ===================== -->
  <nav class="tabbar" aria-label="主导航">
    <a href="#/home" data-tab="home" aria-label="首页">
      <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
      <span>首页</span>
    </a>
    <a href="#/nearby" data-tab="nearby" aria-label="周边">
      <svg viewBox="0 0 24 24"><path d="M12 2.6 20.4 7v10L12 21.4 3.6 17V7z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.6"/></svg>
      <span>周边</span>
    </a>
    <a href="#/apply" data-tab="apply" class="tab-main" aria-label="起降申请">
      <span class="main-puck">
        <svg viewBox="0 0 24 24"><path d="M12 3v13m0-13 6 6m-6-6-6 6M4 20h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <span>申请</span>
    </a>
    <a href="#/messages" data-tab="messages" aria-label="消息">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span>消息</span>
    </a>
    <a href="#/me" data-tab="me" aria-label="我的">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8.4" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4.8 20c.9-3.6 3.7-5.4 7.2-5.4S18.3 16.4 19.2 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>我的</span>
    </a>
  </nav>

  <div id="sheet-root" class="sheet-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <noscript><div class="noscript">挺中航空需要启用 JavaScript。</div></noscript>

  <script src="mock.js"></script>
  <script src="api.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
