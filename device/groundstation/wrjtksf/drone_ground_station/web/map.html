                opt.textContent = ZONE_TYPE_DEFS[k].label;
                if (k === z.type) opt.selected = true;
                sel.appendChild(opt);
            });
            // 旋转值：取第一个矩形的角度
            var rot = 0;
            for (var i = 0; i < z.shapes.length; i++) {
                if (z.shapes[i].type === 'rect') { rot = z.shapes[i].rotation || 0; break; }
            }
            document.getElementById('editZoneRotation').value = rot;
            document.getElementById('editRotVal').textContent = rot + '°';
            editingZoneId = id;
            // 保存快照，用于取消时恢复
            _editSnapshot = {
                shapeCopies: z.shapes.map(function(s) { return cloneShape(s); })
            };
            pendingShapes = [];
            updateDrawUI();
            document.getElementById('drawStatus').textContent = '编辑「' + z.name + '」— 可添加新图形后确认';
            document.getElementById('zoneEditOverlay').classList.add('show');
            toast('编辑模式: ' + z.name + '（可绘制新图形后点确认追加）');
        }

        function closeEditDialog() {
            document.getElementById('zoneEditOverlay').classList.remove('show');
            // 恢复原始形状（撤销旋转滑块实时预览的修改）
            var id = editingZoneId;
            if (id && zones[id] && _editSnapshot) {
                zones[id].shapes = _editSnapshot.shapeCopies;
                renderZone(zones[id]);
                selectZone(id);
                _editSnapshot = null;
            }
            editingZoneId = null;
            pendingShapes = [];
            renderPendingShapes();
            updateDrawUI();

            document.getElementById('drawStatus').textContent = '点击"矩形"或"圆形"开始绘制';
        }

        function saveEditDialog() {
            var id = editingZoneId;
            if (!id || !zones[id]) return;
            var z = zones[id];
            var oldType = z.type;
            z.name = document.getElementById('editZoneName').value.trim() || z.name;
            z.type = document.getElementById('editZoneType').value;
            var rot = parseInt(document.getElementById('editZoneRotation').value) || 0;
            z.shapes.forEach(function(s) { if (s.type === 'rect') { s.rotation = rot; } });
            if (z.type !== oldType) {
                removeZoneLayers(id);
                renderZone(z);
            } else {
                var def = ZONE_TYPE_DEFS[z.type];
                (z._layers || []).forEach(function(l) {
                    var shape = z.shapes[0] || {};
                    l.setPopupContent(
                        '<b>' + z.name + '</b>' +
                        '<br><small>类型: ' + def.label + (shape.rotation ? ' / 旋转' + shape.rotation + '°' : '') + '</small>' +
                        '<br><small><a href="javascript:void(0)" onclick="window._zoneAction(\'hide\',\'' + id + '\')">' + (z.visible ? '隐藏' : '显示') + '</a>' +
                        ' | <a href="javascript:void(0)" style="color:#F56C6C" onclick="window._zoneAction(\'delete\',\'' + id + '\')">删除</a></small>'
                    );
                });
            }
            _editSnapshot = null;  // 清除快照，防止 closeEditDialog 恢复旧值
            closeEditDialog();
            refreshZoneList();
            saveZonesToStorage();
            cancelDrawPrompt();
            toast('已保存: ' + z.name);
        }

        // 弹窗背景点击关闭
        document.getElementById('zoneEditOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeEditDialog();
        });
        document.getElementById('zoneConfirmOverlay').addEventListener('click', function(e) {
            if (e.target === this) cancelConfirmDialog();
        });

        // 确认对话框键盘支持：Enter 确认，Esc 取消
        document.getElementById('confirmZoneName').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); doConfirmZone(); }
            if (e.key === 'Escape') { e.preventDefault(); cancelConfirmDialog(); }
        });

        // ---------- 面板折叠 ----------
        function toggleZoneList() {
            document.getElementById('zoneListPanel').classList.toggle('collapsed');
        }
        window.toggleZoneList = toggleZoneList;

        function toggleZonePanel() {
            var panel = document.getElementById('zonePanel');
            var btn = document.getElementById('btnToggleZone');
            var isShowing = panel.classList.contains('show');
            if (isShowing) {
                panel.classList.remove('show');
                btn.classList.remove('active');
            } else {
                panel.classList.add('show');
                btn.classList.add('active');
            }
        }
        window.toggleZonePanel = toggleZonePanel;

        // ---------- 旋转控制 ----------
        function updateRotateRow() {
            var row = document.getElementById('rotateRow');
            if (selectedZoneId && zones[selectedZoneId] && drawState === 'idle') {
                row.style.display = 'flex';
                // 显示当前旋转角度（取第一个矩形图形的角度）
                var z = zones[selectedZoneId];
                var rectShape = null;
                for (var i = 0; i < z.shapes.length; i++) {
                    if (z.shapes[i].type === 'rect') { rectShape = z.shapes[i]; break; }
                }
                document.getElementById('drawStatus').textContent = rectShape ? '选中「' + z.name + '」— 旋转: ' + (rectShape.rotation || 0) + '°' : '选中「' + z.name + '」（圆形不支持旋转）';
            } else {
                row.style.display = 'none';
            }
        }

        function rotateSelectedZone(deltaDeg) {
            if (!selectedZoneId || !zones[selectedZoneId]) return;
            var z = zones[selectedZoneId];
            var hasRect = false;
            z.shapes.forEach(function(s) {
                if (s.type === 'rect') {
                    s.rotation = ((s.rotation || 0) + deltaDeg) % 360;
                    if (s.rotation < 0) s.rotation += 360;
                    hasRect = true;
                }
            });
            if (hasRect) {
                renderZone(z);
                updateRotateRow();
                toast('旋转: ' + (z.shapes[0].rotation || 0) + '°');
            }
        }

        // 旋转滑块实时预览
        document.getElementById('editZoneRotation').addEventListener('input', function() {
            document.getElementById('editRotVal').textContent = this.value + '°';
            var id = editingZoneId;
            if (id && zones[id]) {
                var z = zones[id];
                z.shapes.forEach(function(s) {
                    if (s.type === 'rect') { s.rotation = parseInt(this.value) || 0; }
                }.bind(this));
                renderZone(z);
            }
        });

        // ---------- 拖拽移动 ----------
        function setupDragHandlers() {
            if (!map) return;
            map.on('mousedown', function(e) {
                if (drawState !== 'idle') return;
                if (!selectedZoneId || !zones[selectedZoneId]) return;
                // 检查点击是否在选中区域的图层上
                var targetLayer = null;
                zonesLayerGroup.eachLayer(function(l) {
                    if (l._zoneId === selectedZoneId && l.getLatLng && !targetLayer) {
                        var ll = l.getLatLng ? l.getLatLng() : null;
                        // simplified check: use map distance
                    }
                });
                // 直接用 e.latlng 判断是否落在 shape 附近
                // 简化：只要是选中区域就允许拖拽
                var z = zones[selectedZoneId];
                var bounds = getZoneBounds(z).pad(0.05);
                if (!bounds.contains(e.latlng)) return;

                zoneDrag.active = true;
                zoneDrag.zoneId = selectedZoneId;
                zoneDrag.startLatLng = e.latlng;
                zoneDrag.moved = false;
                zoneDrag._snapshot = z.shapes.map(function(s) { return cloneShape(s); });
                map.getContainer().style.cursor = 'grabbing';
                L.DomEvent.stopPropagation(e);
            });

            map.on('mousemove', function(e) {
                if (!zoneDrag.active || drawState !== 'idle') return;
                var z = zones[zoneDrag.zoneId];
                if (!z) return;
                var dLat = e.latlng.lat - zoneDrag.startLatLng.lat;
                var dLng = e.latlng.lng - zoneDrag.startLatLng.lng;
                if (Math.abs(dLat) < 0.00002 && Math.abs(dLng) < 0.00002) return;
                zoneDrag.moved = true;

                // 恢复快照并偏移
                var snap = zoneDrag._snapshot;
                z.shapes = snap.map(function(s) {
                    var c = cloneShape(s);
                    if (c.type === 'rect') {
                        c.south += dLat; c.north += dLat;
                        c.west += dLng; c.east += dLng;
                    } else {
                        c.centerLat += dLat; c.centerLng += dLng;
                    }
                    return c;
                });
                renderZone(z);
                L.DomEvent.stopPropagation(e);
            });

            map.on('mouseup', function(e) {
                if (!zoneDrag.active) return;
                map.getContainer().style.cursor = '';
                zoneDrag.active = false;
                zoneDrag.zoneId = null;
                map.getContainer().style.cursor = '';
                // 延迟 reset moved flag 以允许 click 事件先触发
                setTimeout(function() { zoneDrag.moved = false; }, 50);
            });
        }

        // ---------- Toast ----------
        var toastTimer = null;
        function toast(msg) {
            var el = document.getElementById('toastMsg');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2000);
        }

        // ================================================================
        //  localStorage 持久化 — 关闭后重新打开保留区域
        // ================================================================
        function saveZonesToStorage() {
            try {
                var data = [];
                Object.keys(zones).forEach(function(id) {
                    var z = zones[id];
                    data.push({ id: z.id, name: z.name, type: z.type, visible: z.visible, shapes: z.shapes });
                });
                localStorage.setItem('gcs_zones', JSON.stringify(data));
            } catch(e) {}
        }

        function loadZonesFromStorage() {
            try {
                var raw = localStorage.getItem('gcs_zones');
                if (!raw) return;
                var data = JSON.parse(raw);
                if (!data || data.length === 0) return;
                Object.keys(zones).forEach(function(id) { removeZoneLayers(id); });
                zones = {};
                zoneIdCounter = 0;
                data.forEach(function(z) {
                    zones[z.id] = z;
                    if (!z._layers) z._layers = [];
                    var num = parseInt(z.id.replace('zone_', ''));
                    if (!isNaN(num) && num > zoneIdCounter) zoneIdCounter = num;
                    renderZone(z);
                });
                refreshZoneList();
            } catch(e) {}
        }

        // ================================================================
        //  暴露给 Python 的 API（供后续通过 QWebChannel bridge 调用）
        // ================================================================
        window.getZones = function() {
            var result = [];
            Object.keys(zones).forEach(function(id) {
                var z = zones[id];
                result.push({
                    id: z.id, name: z.name, type: z.type, visible: z.visible,
                    shapes: z.shapes.map(function(s) { return cloneShape(s); })
                });
            });
            return JSON.stringify(result);
        };

        window.loadZones = function(jsonStr) {
            try {
                var data = JSON.parse(jsonStr);
                Object.keys(zones).forEach(function(id) { removeZoneLayers(id); });
                zones = {};
                zoneIdCounter = 0;
                data.forEach(function(z) {
                    zones[z.id] = z;
                    if (!z._layers) z._layers = [];
                    var num = parseInt(z.id.replace('zone_', ''));
                    if (!isNaN(num) && num > zoneIdCounter) zoneIdCounter = num;
                    renderZone(z);
                });
                refreshZoneList();
                toast('已加载 ' + data.length + ' 个区域');
            } catch (e) { toast('加载区域数据失败'); }
        };

        window.clearAllZones = function() {
            Object.keys(zones).forEach(function(id) { removeZoneLayers(id); });
            zones = {};
            zoneIdCounter = 0;
            selectedZoneId = null;
            cancelDrawPrompt();
            refreshZoneList();
            localStorage.removeItem('gcs_zones');
            toast('已清除所有区域');
        };

        // 地图弹出层快速操作（隐藏/删除）
        window._zoneAction = function(action, id) {
            if (!zones[id]) return;
            // 先关闭所有弹出层
            if (map) map.closePopup();
            if (action === 'hide') {
                toggleZoneVisibility(id);
            } else if (action === 'delete') {
                promptDeleteZone(id);
            }
        };

        // ================================================================
        //  暴露给 Python / runJavaScript 的区域操作 API
        // ================================================================
        window.zones = zones;
        window.renderZone = renderZone;
        window.saveZonesToStorage = saveZonesToStorage;
        window.refreshZoneList = refreshZoneList;

    </script>
</body>
</html>
